server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Docker's embedded DNS resolves service names when requests arrive.
  # A variable avoids requiring the backend to exist at Nginx startup.
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;
  set $backend_url http://backend:3000;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  location /api/ {
    # Preserve the complete API path and query string expected by Express.
    proxy_pass $backend_url$request_uri;
  }

  location /health {
    proxy_pass $backend_url$request_uri;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
