# TaskFlow: local build and run.
#   cp .env.example .env   # then set real secrets
#   docker compose up -d --build
# All credentials come from .env; nothing secret is written here.

name: taskflow

services:
  frontend:
    build:
      context: ./frontend
    image: taskflow-frontend:local
    restart: unless-stopped
    ports:
      # Host port defaults to 8080 (what CI checks); override with FRONTEND_PORT.
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks: [web]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
    image: taskflow-backend:local
    restart: unless-stopped
    environment:
      PORT: ${PORT:-3000}
      # Service names, not localhost: postgres and redis resolve on the data network.
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in .env}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
    ports:
      - "${BACKEND_PORT:-3000}:${PORT:-3000}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [web, data]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + (process.env.PORT || 3000) + '/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-taskflow}
      POSTGRES_USER: ${POSTGRES_USER:-taskflow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Creates the users and tasks tables on first start (empty volume only).
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  web:    # frontend <-> backend
  data:   # backend <-> postgres, redis (not reachable from the frontend)

volumes:
  postgres_data:
