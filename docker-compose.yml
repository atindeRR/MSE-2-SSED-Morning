services:

  # ──────────────────────────────────────────
  # Frontend – React/Vite served by Nginx
  # Accessible at http://localhost:8080
  # ──────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
    image: taskflow-frontend:latest
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

  # ──────────────────────────────────────────
  # Backend – Node.js / Express API
  # Health endpoint: http://localhost:3000/health
  # ──────────────────────────────────────────
  backend:
    build:
      context: ./backend
    image: taskflow-backend:latest
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      NODE_ENV: production
      # Credentials are injected at runtime; no secrets are hardcoded.
      DATABASE_URL: postgresql://taskflow_user:${POSTGRES_PASSWORD}@postgres:5432/taskflow
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ──────────────────────────────────────────
  # PostgreSQL 16
  # ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: taskflow
      POSTGRES_USER: taskflow_user
      # Falls back to a development-only value when POSTGRES_PASSWORD is unset.
      # Always override this in production.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_change_me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow_user -d taskflow"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ──────────────────────────────────────────
  # Redis 7
  # ──────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

# ──────────────────────────────────────────
# Named volumes
# ──────────────────────────────────────────
volumes:
  postgres_data:
