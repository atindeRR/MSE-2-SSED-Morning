services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # Persistent data storage — survives container restarts and rebuilds
      - postgres-data:/var/lib/postgresql/data
      # Auto-execute schema on first start (init.sql is idempotent — uses IF NOT EXISTS)
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - taskflow-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - taskflow-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # ── Backend ─────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      PORT:         ${PORT}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL:    ${REDIS_URL}
      JWT_SECRET:   ${JWT_SECRET}
    # Publish to host so the CI workflow can reach localhost:3000 directly
    ports:
      - "3000:3000"
    networks:
      - taskflow-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Frontend ─────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    networks:
      - taskflow-network
    depends_on:
      - backend

# ── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  postgres-data:

# ── Networks ─────────────────────────────────────────────────────────────────
networks:
  taskflow-network:
    driver: bridge
