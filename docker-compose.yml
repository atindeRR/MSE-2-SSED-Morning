
services:

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    image: ${DOCKERHUB_USERNAME:-local}/taskflow-frontend:latest

    ports:
      - "8080:80"

    depends_on:
      backend:
        condition: service_healthy

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - taskflow-network


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    image: ${DOCKERHUB_USERNAME:-local}/taskflow-backend:latest

    ports:
      - "3000:3000"

    environment:
      PORT: "3000"

      DATABASE_URL: ${DATABASE_URL}

      REDIS_URL: redis://redis:6379

      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    restart: unless-stopped

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"

      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    networks:
      - taskflow-network


  postgres:
    image: postgres:16-alpine

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-taskflow}
      POSTGRES_USER: ${POSTGRES_USER:-taskflow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-taskflow_user} -d ${POSTGRES_DB:-taskflow}

      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - taskflow-network


  redis:
    image: redis:7-alpine

    restart: unless-stopped

    ports:
      - "127.0.0.1:6379:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - taskflow-network


volumes:
  postgres_data:


networks:
  taskflow-network:
    driver: bridge
