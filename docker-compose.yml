# Build + run the whole stack locally:  docker compose up -d --build
# Values come from .env (copy .env.example -> .env). No secrets are hardcoded here.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data                         # persistence
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro  # creates tables on first start
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [taskflow]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [taskflow]

  backend:
    build: ./backend
    image: ${DOCKERHUB_USERNAME:-local}/taskflow-backend:latest
    restart: unless-stopped
    environment:
      PORT: ${PORT:-3000}
      DATABASE_URL: ${DATABASE_URL}   # host is "postgres" (service name), not localhost
      REDIS_URL: ${REDIS_URL}         # host is "redis" (service name)
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [taskflow]

  frontend:
    build: ./frontend
    image: ${DOCKERHUB_USERNAME:-local}/taskflow-frontend:latest
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    networks: [taskflow]

networks:
  taskflow:
    driver: bridge

volumes:
  postgres_data:
