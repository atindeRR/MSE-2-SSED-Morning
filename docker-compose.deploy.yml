version: '3.8'

services:
  # PostgreSQL Database Service
  postgres:
    image: postgres:16-alpine
    container_name: taskflow-postgres-deploy
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-taskflow}
      POSTGRES_USER: ${POSTGRES_USER:-taskflow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_this_db_password}
    volumes:
      # Persistent data storage
      - postgres_data:/var/lib/postgresql/data
      # Initialize database schema on first run
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-taskflow_user} -d ${POSTGRES_DB:-taskflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - taskflow-network
    restart: unless-stopped

  # Redis Cache Service
  redis:
    image: redis:7-alpine
    container_name: taskflow-redis-deploy
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - taskflow-network
    restart: unless-stopped

  # Backend API Service - Using published Docker Hub image
  backend:
    image: ${DOCKERHUB_USERNAME:-YOUR_DOCKERHUB_USERNAME}/taskflow-backend:latest
    container_name: taskflow-backend-deploy
    environment:
      PORT: ${PORT:-3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-taskflow_user}:${POSTGRES_PASSWORD:-change_this_db_password}@postgres:5432/${POSTGRES_DB:-taskflow}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-replace_with_a_long_random_secret}
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - taskflow-network
    restart: unless-stopped

  # Frontend Web Service - Using published Docker Hub image
  frontend:
    image: ${DOCKERHUB_USERNAME:-YOUR_DOCKERHUB_USERNAME}/taskflow-frontend:latest
    container_name: taskflow-frontend-deploy
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - taskflow-network
    restart: unless-stopped

# Named volumes for persistent data
volumes:
  postgres_data:
    driver: local

# Custom bridge network for service communication
networks:
  taskflow-network:
    driver: bridge
