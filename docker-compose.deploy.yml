services:

  # ── PostgreSQL Database ─────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - taskflow-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── Redis Cache ─────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - taskflow-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # ── Backend API (Published Docker Hub Image) ────────────────────────────────
  backend:
    image: ${DOCKERHUB_USERNAME:-ayushpandeyap975}/taskflow-backend:latest
    restart: unless-stopped
    environment:
      PORT:         ${PORT}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL:    ${REDIS_URL}
      JWT_SECRET:   ${JWT_SECRET}
    ports:
      - "3000:3000"
    networks:
      - taskflow-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Frontend (Published Docker Hub Image) ───────────────────────────────────
  frontend:
    image: ${DOCKERHUB_USERNAME:-ayushpandeyap975}/taskflow-frontend:latest
    restart: unless-stopped
    ports:
      - "8080:80"
    networks:
      - taskflow-network
    depends_on:
      - backend

# ── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  postgres-data:

# ── Networks ─────────────────────────────────────────────────────────────────
networks:
  taskflow-network:
    driver: bridge
