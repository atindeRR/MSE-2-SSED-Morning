services:
  frontend:
    image: "${DOCKERHUB_USERNAME:-salonisingh2448}/taskflow-frontend:latest"
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - taskflow-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    image: "${DOCKERHUB_USERNAME:-salonisingh2448}/taskflow-backend:latest"
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: "postgresql://${POSTGRES_USER:-taskflow_user}:${POSTGRES_PASSWORD:-deployment_change_me}@postgres:5432/${POSTGRES_DB:-taskflow}"
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET: "${JWT_SECRET:-replace_with_a_long_random_secret}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - taskflow-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-taskflow}"
      POSTGRES_USER: "${POSTGRES_USER:-taskflow_user}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-deployment_change_me}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - taskflow-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-taskflow_user} -d ${POSTGRES_DB:-taskflow}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    networks:
      - taskflow-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

networks:
  taskflow-network:

volumes:
  postgres-data:
