services:
  postgres:
    image: postgres:15-alpine
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow_user -d taskflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    networks:
      - backend_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    # Notice we use 'image' instead of 'build' here
    image: harshvardhanshukla/backend:latest
    ports:
      - "3000:3000"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - frontend_net
      - backend_net

  frontend:
    # Notice we use 'image' instead of 'build' here
    image: harshvardhanshukla/frontend:latest
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - frontend_net

networks:
  frontend_net:
  backend_net:

volumes:
  pg_data: