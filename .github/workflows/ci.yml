
name: Docker Practical - CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate frontend Dockerfile
        run: docker run --rm -i hadolint/hadolint < frontend/Dockerfile

      - name: Validate backend Dockerfile
        run: docker run --rm -i hadolint/hadolint < backend/Dockerfile

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Build images
        run: docker compose build

      - name: Start services
        run: docker compose up -d

      - name: Verify backend health
        run: |
          for i in $(seq 1 40); do
            if curl --fail http://localhost:3000/health; then
              exit 0
            fi
            sleep 3
          done
          docker compose logs
          exit 1

      - name: Verify frontend
        run: curl --fail http://localhost:8080/

      - name: Verify services
        run: docker compose ps

      - name: Cleanup
        if: always()
        run: docker compose down -v

