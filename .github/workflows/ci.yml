name: Docker Practical - CI Evaluation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-practical-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    name: Validate, build and test submission
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout submitted Pull Request commit
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Show submission identity
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Commit: $GITHUB_SHA"
          if [ -f submission.json ]; then
            cat submission.json
          else
            echo "::warning::submission.json is missing"
          fi

      - name: Check required files
        run: |
          for file in \
            backend/Dockerfile \
            backend/db/init.sql \
            backend/package.json \
            frontend/Dockerfile \
            frontend/nginx.conf \
            frontend/package.json \
            docker-compose.yml \
            docker-compose.deploy.yml \
            tests/package.json \
            tests/api.test.js
          do
            if [ ! -f "$file" ]; then
              echo "::error::Required file missing: $file"
              exit 1
            fi
          done

      - name: Validate frontend Dockerfile
        run: docker run --rm -i hadolint/hadolint < frontend/Dockerfile

      - name: Validate backend Dockerfile
        run: docker run --rm -i hadolint/hadolint < backend/Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create CI environment file
        run: |
          python3 - <<'PY'
          import secrets
          from pathlib import Path

          password = secrets.token_hex(32)
          values = {
              "POSTGRES_DB": "taskflow",
              "POSTGRES_USER": "taskflow_user",
              "POSTGRES_PASSWORD": password,
              "DATABASE_URL": (
                  f"postgresql://taskflow_user:{password}@postgres:5432/taskflow"
              ),
              "REDIS_URL": "redis://redis:6379",
              "JWT_SECRET": secrets.token_hex(32),
              "PORT": "3000",
          }
          Path(".env").write_text(
              "".join(f"{key}={value}\n" for key, value in values.items()),
              encoding="utf-8",
          )
          PY

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Build frontend and backend images
        run: docker compose build

      - name: Start application stack
        run: docker compose up -d

      - name: Wait for backend health
        run: |
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://localhost:3000/health; then
              echo
              echo "Backend is healthy"
              exit 0
            fi
            echo "Waiting for backend ($attempt/40)..."
            sleep 3
          done
          echo "Backend did not become healthy"
          docker compose ps
          docker compose logs --no-color
          exit 1

      - name: Check frontend response
        run: |
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://localhost:8081/ > /dev/null; then
              echo "Frontend is responding"
              exit 0
            fi
            sleep 3
          done
          docker compose logs frontend
          exit 1

      - name: Install test dependencies
        working-directory: tests
        run: npm install

      - name: Run API and Redis tests
        working-directory: tests
        env:
          BASE_URL: http://localhost:3000
          NODE_OPTIONS: --experimental-vm-modules
        run: npm test -- --json --outputFile=test-results.json

      - name: Test PostgreSQL persistence
        run: |
          users_before=$(docker compose exec -T postgres \
            psql -U taskflow_user -d taskflow -tAc 'SELECT COUNT(*) FROM users')
          docker compose stop backend
          docker compose restart postgres

          for attempt in $(seq 1 30); do
            if docker compose exec -T postgres \
              pg_isready -U taskflow_user -d taskflow > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "PostgreSQL did not recover after its restart"
              docker compose ps
              docker compose logs --no-color
              exit 1
            fi
            sleep 2
          done

          users_after=$(docker compose exec -T postgres \
            psql -U taskflow_user -d taskflow -tAc 'SELECT COUNT(*) FROM users')
          if [ "$users_before" != "$users_after" ]; then
            echo "::error::PostgreSQL user count changed after restart"
            exit 1
          fi
          echo "PostgreSQL retained $users_after user rows after restart"

          docker compose start backend
          for attempt in $(seq 1 20); do
            if curl --fail --silent --max-time 5 \
              http://localhost:3000/health > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              echo "Application did not recover after the PostgreSQL restart"
              docker compose ps
              docker compose logs --no-color
              exit 1
            fi
            sleep 3
          done

      - name: Capture container status and logs
        if: always()
        run: |
          mkdir -p evaluation-output
          docker compose ps > evaluation-output/containers.txt || true
          docker compose logs --no-color > evaluation-output/container-logs.txt || true

      - name: Generate evaluation summary
        if: always()
        run: |
          {
            echo "## Docker Practical CI Evaluation"
            echo ""
            echo "- Repository: \`$GITHUB_REPOSITORY\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Pull request: \`${{ github.event.pull_request.html_url || 'Manual run' }}\`"
            echo ""
            echo "Review the workflow jobs and uploaded artifacts for detailed results."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-practical-results-${{ github.run_id }}
          path: |
            tests/test-results.json
            evaluation-output/
          if-no-files-found: ignore
          retention-days: 30

      - name: Cleanup containers
        if: always()
        run: docker compose down --remove-orphans || true
