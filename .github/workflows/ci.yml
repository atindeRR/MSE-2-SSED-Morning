name: Docker Practical - CI Evaluation

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-practical-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    name: Validate, build and test submission
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout submitted Pull Request commit
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Checkout instructor-controlled evaluation files
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: main
          path: instructor-evaluation

      - name: Show submission identity
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Commit: $GITHUB_SHA"
          if [ -f submission.json ]; then
            cat submission.json
          else
            echo "::warning::submission.json is missing"
          fi

      - name: Check required files
        run: |
          if [ -f instructor-evaluation/scripts/check-required-files.sh ]; then
            bash instructor-evaluation/scripts/check-required-files.sh
          elif [ -f scripts/check-required-files.sh ]; then
            bash scripts/check-required-files.sh
          else
            echo "Checking required files locally..."
            test -f frontend/Dockerfile || (echo "Missing frontend/Dockerfile" && exit 1)
            test -f backend/Dockerfile || (echo "Missing backend/Dockerfile" && exit 1)
            test -f docker-compose.yml || (echo "Missing docker-compose.yml" && exit 1)
            test -f docker-compose.deploy.yml || (echo "Missing docker-compose.deploy.yml" && exit 1)
            echo "All required files are present"
          fi

      - name: Validate frontend Dockerfile
        run: docker run --rm -i hadolint/hadolint < frontend/Dockerfile

      - name: Validate backend Dockerfile
        run: docker run --rm -i hadolint/hadolint < backend/Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create CI environment file
        run: |
          cat > .env <<'EOF'
          POSTGRES_DB=taskflow
          POSTGRES_USER=taskflow_user
          POSTGRES_PASSWORD=ci_test_password_123
          DATABASE_URL=postgresql://taskflow_user:ci_test_password_123@postgres:5432/taskflow
          REDIS_URL=redis://redis:6379
          JWT_SECRET=ci_only_secret_change_for_real_deployment
          PORT=3000
          EOF

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Build frontend and backend images
        run: docker compose build

      - name: Start application stack
        run: docker compose up -d

      - name: Wait for backend health
        run: |
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://localhost:3000/health; then
              echo
              echo "Backend is healthy"
              exit 0
            fi
            echo "Waiting for backend ($attempt/40)..."
            sleep 3
          done
          echo "Backend did not become healthy"
          docker compose ps
          docker compose logs --no-color
          exit 1

      - name: Check frontend response
        run: |
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://localhost:8080/ > /dev/null; then
              echo "Frontend is responding"
              exit 0
            fi
            echo "Waiting for frontend ($attempt/20)..."
            sleep 3
          done
          docker compose logs frontend
          exit 1

      - name: Install test dependencies
        run: |
          if [ -d instructor-evaluation/tests ]; then
            cd instructor-evaluation/tests && npm install
          else
            cd tests && npm install
          fi

      - name: Run API and Redis tests
        env:
          BASE_URL: http://localhost:3000
          NODE_OPTIONS: --experimental-vm-modules
        run: |
          if [ -d instructor-evaluation/tests ]; then
            cd instructor-evaluation/tests && npm test -- --json --outputFile=test-results.json
          else
            cd tests && npm test -- --json --outputFile=test-results.json
          fi

      - name: Test PostgreSQL persistence
        run: |
          if [ -f instructor-evaluation/scripts/persistence-test.sh ]; then
            bash instructor-evaluation/scripts/persistence-test.sh
          elif [ -f scripts/persistence-test.sh ]; then
            bash scripts/persistence-test.sh
          else
            echo "Testing PostgreSQL persistence..."
            DB_USER="${POSTGRES_USER:-taskflow_user}"
            DB_NAME="${POSTGRES_DB:-taskflow}"
            PERSIST_EMAIL="persistence-check-$(date +%s)@example.com"
            docker compose exec -T postgres psql -U "$DB_USER" -d "$DB_NAME" -c \
              "INSERT INTO users (name, email, password_hash) VALUES ('Persistence Tester', '$PERSIST_EMAIL', 'hashed_pw_test');"
            docker compose restart postgres
            for i in $(seq 1 30); do
              if docker compose exec -T postgres pg_isready -U "$DB_USER" -d "$DB_NAME"; then
                echo "PostgreSQL is accepting connections ($i/30)"
                break
              fi
              sleep 2
            done
            for i in $(seq 1 30); do
              if curl --fail --silent http://localhost:3000/health > /dev/null; then
                echo "Backend /health returned 200 OK after PostgreSQL restart ($i/30)"
                break
              fi
              sleep 2
            done
            FOUND=$(docker compose exec -T postgres psql -U "$DB_USER" -d "$DB_NAME" -t -A -c \
              "SELECT email FROM users WHERE email = '$PERSIST_EMAIL';")
            if [ "$FOUND" = "$PERSIST_EMAIL" ]; then
              echo "PostgreSQL persistence check passed! Record '$FOUND' survived restart."
            else
              echo "PostgreSQL persistence check failed! Record '$PERSIST_EMAIL' not found."
              exit 1
            fi
          fi

      - name: Capture container status and logs
        if: always()
        run: |
          mkdir -p evaluation-output
          docker compose ps > evaluation-output/containers.txt || true
          docker compose logs --no-color > evaluation-output/container-logs.txt || true

      - name: Generate evaluation summary
        if: always()
        run: |
          {
            echo "## Docker Practical CI Evaluation"
            echo ""
            echo "- Repository: \`$GITHUB_REPOSITORY\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Pull request: \`${{ github.event.pull_request.html_url || 'Manual run' }}\`"
            echo ""
            echo "Review the workflow jobs and uploaded artifacts for detailed results."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-practical-results-${{ github.run_id }}
          path: |
            instructor-evaluation/tests/test-results.json
            tests/test-results.json
            evaluation-output/
          if-no-files-found: ignore
          retention-days: 30

      - name: Cleanup containers
        if: always()
        run: docker compose down -v --remove-orphans || true
