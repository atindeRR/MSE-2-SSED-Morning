
name: Docker Practical - CI Evaluation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-practical-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    name: Validate, build and test submission
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout submitted Pull Request commit
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Show submission identity
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Commit: $GITHUB_SHA"
          if [ -f submission.json ]; then
            cat submission.json
          else
            echo "::warning::submission.json is missing"
          fi

      - name: Check required files
        run: |
          set -e
          required_files=(
            "frontend/Dockerfile"
            "backend/Dockerfile"
            "docker-compose.yml"
            "docker-compose.deploy.yml"
            "backend/db/init.sql"
            "tests/api.test.js"
            "tests/package.json"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "::error::Missing required file: $file"
              exit 1
            fi
            echo "Found: $file"
          done

      - name: Validate frontend Dockerfile
        run: docker run --rm -i hadolint/hadolint < frontend/Dockerfile

      - name: Validate backend Dockerfile
        run: docker run --rm -i hadolint/hadolint < backend/Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create CI environment file
        run: |
          cat > .env <<'EOF'
          POSTGRES_DB=taskflow
          POSTGRES_USER=taskflow_user
          POSTGRES_PASSWORD=ci_test_password_123
          DATABASE_URL=postgresql://taskflow_user:ci_test_password_123@postgres:5432/taskflow
          REDIS_URL=redis://redis:6379
          JWT_SECRET=ci_only_secret_change_for_real_deployment
          PORT=3000
          EOF

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Build frontend and backend images
        run: docker compose build

      - name: Start application stack
        run: docker compose up -d

      - name: Wait for backend health
        run: |
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://localhost:3000/health; then
              echo
              echo "Backend is healthy"
              exit 0
            fi
            echo "Waiting for backend ($attempt/40)..."
            sleep 3
          done

          echo "Backend did not become healthy"
          docker compose ps
          docker compose logs --no-color
          exit 1

      - name: Check frontend response
        run: |
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://localhost:8080/ > /dev/null; then
              echo "Frontend is responding"
              exit 0
            fi
            sleep 3
          done

          docker compose logs frontend
          exit 1

      - name: Install test dependencies
        working-directory: tests
        run: npm install

      - name: Run API and Redis tests
        working-directory: tests
        env:
          BASE_URL: http://localhost:3000
        run: NODE_OPTIONS=--experimental-vm-modules npm test -- --json --outputFile=test-results.json

      - name: Test PostgreSQL persistence
        run: |
          set -e

          echo "Checking PostgreSQL data persistence..."

          docker compose exec -T postgres \
            psql -U taskflow_user -d taskflow \
            -c "CREATE TABLE IF NOT EXISTS ci_persistence_check (id SERIAL PRIMARY KEY, value TEXT);"

          docker compose exec -T postgres \
            psql -U taskflow_user -d taskflow \
            -c "INSERT INTO ci_persistence_check (value) VALUES ('persistence_verified');"

          docker compose restart postgres

          for attempt in $(seq 1 20); do
            if docker compose exec -T postgres \
              pg_isready -U taskflow_user -d taskflow; then
              break
            fi
            sleep 3
          done

          RESULT=$(docker compose exec -T postgres \
            psql -U taskflow_user -d taskflow -tAc \
            "SELECT value FROM ci_persistence_check ORDER BY id DESC LIMIT 1;")

          if [ "$RESULT" != "persistence_verified" ]; then
            echo "::error::PostgreSQL persistence test failed"
            exit 1
          fi

          echo "PostgreSQL persistence verified successfully"

      - name: Capture container status and logs
        if: always()
        run: |
          mkdir -p evaluation-output
          docker compose ps > evaluation-output/containers.txt || true
          docker compose logs --no-color > evaluation-output/container-logs.txt || true

      - name: Generate evaluation summary
        if: always()
        run: |
          {
            echo "## Docker Practical CI Evaluation"
            echo ""
            echo "- Repository: \`$GITHUB_REPOSITORY\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Pull request: \`${{ github.event.pull_request.html_url || 'Manual run' }}\`"
            echo ""
            echo "Review the workflow jobs and uploaded artifacts for detailed results."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-practical-results-${{ github.run_id }}
          path: |
            tests/test-results.json
            evaluation-output/
          if-no-files-found: ignore
          retention-days: 30

      - name: Cleanup containers
        if: always()
        run: docker compose down -v --remove-orphans || true
