
name: Docker Practical - CI Evaluation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-practical-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    name: Validate, build and test submission
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout submitted repository
        uses: actions/checkout@v4

      - name: Show submission identity
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Commit: $GITHUB_SHA"

      - name: Check required files
        run: |
          set -e
          files=(
            backend/Dockerfile
            backend/package.json
            backend/db/init.sql
            backend/src/server.js
            frontend/Dockerfile
            frontend/package.json
            frontend/nginx.conf
            docker-compose.yml
            docker-compose.deploy.yml
            tests/package.json
            tests/package-lock.json
            tests/api.test.js
          )

          for file in "${files[@]}"; do
            if [ ! -s "$file" ]; then
              echo "Missing or empty required file: $file"
              exit 1
            fi
            echo "Verified: $file"
          done

      - name: Validate frontend Dockerfile
        run: docker run --rm -i hadolint/hadolint < frontend/Dockerfile

      - name: Validate backend Dockerfile
        run: docker run --rm -i hadolint/hadolint < backend/Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create CI environment file
        run: |
          {
            echo "POSTGRES_DB=taskflow"
            echo "POSTGRES_USER=taskflow_user"
            echo "POSTGRES_PASSWORD=ci_test_password_123"
            echo "DATABASE_URL=postgresql://taskflow_user:ci_test_password_123@postgres:5432/taskflow"
            echo "REDIS_URL=redis://redis:6379"
            echo "JWT_SECRET=ci_only_secret_change_for_real_deployment"
            echo "PORT=3000"
          } > .env

      - name: Validate Docker Compose configuration
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.deploy.yml config --quiet

      - name: Build frontend and backend images
        run: docker compose build

      - name: Start application stack
        run: docker compose up -d

      - name: Wait for backend health
        run: |
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://localhost:3000/health; then
              echo
              echo "Backend is healthy"
              exit 0
            fi
            echo "Waiting for backend ($attempt/40)..."
            sleep 3
          done

          docker compose ps
          docker compose logs --no-color
          exit 1

      - name: Check frontend response
        run: |
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://localhost:8080/ > /dev/null; then
              echo "Frontend is responding"
              exit 0
            fi
            sleep 3
          done

          docker compose logs frontend
          exit 1

      - name: Install API test dependencies
        working-directory: tests
        run: npm ci

      - name: Run API and Redis tests
        working-directory: tests
        env:
          BASE_URL: http://localhost:3000
          NODE_OPTIONS: --experimental-vm-modules
        run: npm test -- --json --outputFile=test-results.json

      - name: Test PostgreSQL persistence
        run: |
          before=$(docker compose exec -T postgres psql \
            -U taskflow_user -d taskflow -tAc "SELECT COUNT(*) FROM users")

          echo "Users before restart: $before"

          docker compose down
          docker compose up -d

          for attempt in $(seq 1 40); do
            if curl --fail --silent http://localhost:3000/health > /dev/null; then
              break
            fi
            sleep 3
          done

          curl --fail --silent http://localhost:3000/health > /dev/null

          after=$(docker compose exec -T postgres psql \
            -U taskflow_user -d taskflow -tAc "SELECT COUNT(*) FROM users")

          echo "Users after restart: $after"

          if [ "$before" != "$after" ]; then
            echo "PostgreSQL persistence verification failed"
            exit 1
          fi

          echo "PostgreSQL persistence verified"

      - name: Capture container status and logs
        if: always()
        run: |
          mkdir -p evaluation-output
          docker compose ps > evaluation-output/containers.txt || true
          docker compose logs --no-color > evaluation-output/container-logs.txt || true

      - name: Generate evaluation summary
        if: always()
        run: |
          {
            echo "## Docker Practical CI Evaluation"
            echo ""
            echo "- Repository: \`$GITHUB_REPOSITORY\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Result: Review workflow steps"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-practical-results-${{ github.run_id }}
          path: |
            tests/test-results.json
            evaluation-output/
          if-no-files-found: ignore
          retention-days: 30

      - name: Cleanup containers
        if: always()
        run: docker compose down -v --remove-orphans || true
