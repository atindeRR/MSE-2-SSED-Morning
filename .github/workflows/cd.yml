name: Docker Practical - Publish and Verify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-practical-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish and Deploy Docker Images
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required secrets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || exit 1
          test -n "$DOCKERHUB_TOKEN" || exit 1
          test -n "$POSTGRES_PASSWORD" || exit 1
          test -n "$JWT_SECRET" || exit 1
          echo "All required secrets are configured."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/backend:${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend:${{ github.sha }}

      # Create deployment environment with URL-encoded DB password
      - name: Create deployment environment file
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          umask 077

          DATABASE_URL=$(node -e "process.stdout.write('postgresql://taskflow_user:' + encodeURIComponent(process.env.POSTGRES_PASSWORD) + '@postgres:5432/taskflow')")

          {
            echo "POSTGRES_DB=taskflow"
            echo "POSTGRES_USER=taskflow_user"
            echo "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}"
            echo "DATABASE_URL=${DATABASE_URL}"
            echo "REDIS_URL=redis://redis:6379"
            echo "JWT_SECRET=${JWT_SECRET}"
            echo "PORT=3000"
          } > .env

          echo "Deployment environment file created."

      - name: Validate deployment Compose
        run: |
          if grep -Eq '^[[:space:]]+build:' docker-compose.deploy.yml; then
            echo "ERROR: Deployment Compose must use published images."
            exit 1
          fi

          docker compose --env-file .env \
            -f docker-compose.deploy.yml config --quiet

          echo "Deployment Compose configuration is valid."

      - name: Pull published images
        run: |
          docker compose --env-file .env \
            -f docker-compose.deploy.yml pull

      - name: Start PostgreSQL and Redis
        run: |
          docker compose --env-file .env \
            -f docker-compose.deploy.yml up -d postgres redis

      - name: Wait for infrastructure
        run: |
          wait_for_health() {
            SERVICE="$1"
            CONTAINER=$(docker compose --env-file .env \
              -f docker-compose.deploy.yml ps -q "$SERVICE")

            if [ -z "$CONTAINER" ]; then
              echo "Container for $SERVICE was not created."
              exit 1
            fi

            for i in $(seq 1 60); do
              STATUS=$(docker inspect \
                --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' \
                "$CONTAINER")

              echo "$SERVICE status: $STATUS"

              if [ "$STATUS" = "healthy" ]; then
                return 0
              fi

              if [ "$STATUS" = "unhealthy" ] || [ "$STATUS" = "exited" ]; then
                docker compose --env-file .env \
                  -f docker-compose.deploy.yml logs "$SERVICE"
                exit 1
              fi

              sleep 2
            done

            echo "$SERVICE health check timed out."
            docker compose --env-file .env \
              -f docker-compose.deploy.yml logs "$SERVICE"
            exit 1
          }

          wait_for_health postgres
          wait_for_health redis

      - name: Start backend
        run: |
          docker compose --env-file .env \
            -f docker-compose.deploy.yml up -d backend

      - name: Verify backend health
        run: |
          CONTAINER=$(docker compose --env-file .env \
            -f docker-compose.deploy.yml ps -q backend)

          for i in $(seq 1 60); do
            STATUS=$(docker inspect \
              --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' \
              "$CONTAINER")

            echo "Backend status: $STATUS"

            if [ "$STATUS" = "healthy" ]; then
              echo "Backend is healthy."
              exit 0
            fi

            if [ "$STATUS" = "unhealthy" ] || [ "$STATUS" = "exited" ]; then
              echo "Backend failed. Showing logs:"
              docker compose --env-file .env \
                -f docker-compose.deploy.yml logs --no-color backend
              exit 1
            fi

            sleep 2
          done

          echo "Backend health check timed out."
          docker compose --env-file .env \
            -f docker-compose.deploy.yml logs --no-color backend
          exit 1

      - name: Start frontend
        run: |
          docker compose --env-file .env \
            -f docker-compose.deploy.yml up -d frontend

      - name: Verify deployment
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent http://localhost:3000/health; then
              echo
              echo "Backend API is responding."
              break
            fi

            if [ "$i" -eq 30 ]; then
              docker compose --env-file .env \
                -f docker-compose.deploy.yml ps -a
              docker compose --env-file .env \
                -f docker-compose.deploy.yml logs --no-color
              exit 1
            fi

            sleep 2
          done

          curl --fail --silent http://localhost:8080/ > /dev/null
          echo "Frontend is responding."

      - name: Run API tests
        working-directory: tests
        env:
          BASE_URL: http://localhost:3000
          NODE_OPTIONS: --experimental-vm-modules
        run: |
          npm install
          npm test

      - name: Record published image references
        run: |
          {
            echo "## Docker Hub Publication"
            echo ""
            echo "- Backend: ${{ secrets.DOCKERHUB_USERNAME }}/backend:latest"
            echo "- Frontend: ${{ secrets.DOCKERHUB_USERNAME }}/frontend:latest"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Deployment: Successful"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect failure diagnostics
        if: failure()
        run: |
          echo "=== Container Status ==="
          docker compose --env-file .env \
            -f docker-compose.deploy.yml ps -a || true

          echo "=== Backend Logs ==="
          docker compose --env-file .env \
            -f docker-compose.deploy.yml logs --no-color backend || true

          echo "=== PostgreSQL Logs ==="
          docker compose --env-file .env \
            -f docker-compose.deploy.yml logs --no-color postgres || true

          echo "=== Redis Logs ==="
          docker compose --env-file .env \
            -f docker-compose.deploy.yml logs --no-color redis || true

          echo "=== Frontend Logs ==="
          docker compose --env-file .env \
            -f docker-compose.deploy.yml logs --no-color frontend || true

      - name: Cleanup deployment
        if: always()
        run: |
          docker compose --env-file .env \
            -f docker-compose.deploy.yml down -v --remove-orphans || true
