
name: Docker Practical - Publish and Verify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-practical-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish student's images to Docker Hub
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout student's repository
        uses: actions/checkout@v4

      - name: Validate Docker Hub secrets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || {
            echo "Missing DOCKERHUB_USERNAME"
            exit 1
          }

          test -n "$DOCKERHUB_TOKEN" || {
            echo "Missing DOCKERHUB_TOKEN"
            exit 1
          }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-backend:${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-frontend:${{ github.sha }}

      - name: Create deployment environment file
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          DB_PASSWORD=$(openssl rand -hex 24)
          JWT_SECRET=$(openssl rand -hex 32)

          {
            echo "POSTGRES_DB=taskflow"
            echo "POSTGRES_USER=taskflow_user"
            echo "POSTGRES_PASSWORD=$DB_PASSWORD"
            echo "DATABASE_URL=postgresql://taskflow_user:${DB_PASSWORD}@postgres:5432/taskflow"
            echo "REDIS_URL=redis://redis:6379"
            echo "JWT_SECRET=$JWT_SECRET"
            echo "PORT=3000"
            echo "DOCKERHUB_USERNAME=$DOCKERHUB_USERNAME"
          } > .env

      - name: Validate image-based deployment Compose
        run: |
          if grep -Eq '^[[:space:]]+build:' docker-compose.deploy.yml; then
            echo "Deployment Compose must use published images, not build."
            exit 1
          fi

          docker compose -f docker-compose.deploy.yml config --quiet

      - name: Pull published images
        run: |
          docker compose -f docker-compose.deploy.yml pull

      - name: Deploy using Docker Hub images
        run: |
          docker compose -f docker-compose.deploy.yml up -d

      - name: Verify deployment
        shell: bash
        run: |
          set -Eeuo pipefail

          COMPOSE="docker compose -f docker-compose.deploy.yml"

          diagnostics() {
            echo "========== COMPOSE STATUS =========="
            $COMPOSE ps || true

            echo "========== BACKEND LOGS =========="
            $COMPOSE logs --no-color --tail=100 backend || true

            echo "========== FRONTEND LOGS =========="
            $COMPOSE logs --no-color --tail=100 frontend || true

            echo "========== FRONTEND INSPECT =========="
            docker inspect taskflow-frontend-deploy \
              --format='Status={{.State.Status}} ExitCode={{.State.ExitCode}} Health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' || true

            echo "========== FRONTEND HEALTH CHECK DETAILS =========="
            docker inspect taskflow-frontend-deploy \
              --format='{{json .State.Health.Log}}' || true

            echo "========== FRONTEND IMAGE HEALTHCHECK =========="
            docker inspect taskflow-frontend-deploy \
              --format='{{json .Config.Healthcheck}}' || true

            echo "========== FRONTEND NETWORK =========="
            docker inspect taskflow-frontend-deploy \
              --format='{{json .NetworkSettings.Networks}}' || true

            echo "========== FRONTEND INTERNAL HTTP TEST =========="
            docker exec taskflow-frontend-deploy \
              wget -S -O /dev/null http://127.0.0.1:8080/ || true
          }

          echo "Waiting for backend container..."

          backend_ok=false

          for attempt in $(seq 1 40); do
            status=$(docker inspect taskflow-backend-deploy \
              --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' \
              2>/dev/null || true)

            echo "Backend status: $status ($attempt/40)"

            if [ "$status" = "healthy" ]; then
              backend_ok=true
              break
            fi

            sleep 3
          done

          if [ "$backend_ok" != "true" ]; then
            echo "Backend container did not become healthy."
            diagnostics
            exit 1
          fi

          echo "Backend container is healthy."

          if ! curl --connect-timeout 5 --max-time 20 \
            --retry 5 --retry-all-errors --retry-delay 2 \
            --fail --silent --show-error \
            http://localhost:3000/health; then
            echo "Backend HTTP health check failed."
            diagnostics
            exit 1
          fi

          echo
          echo "Backend HTTP check passed."

          echo "Waiting for frontend container..."

          frontend_ok=false

          for attempt in $(seq 1 40); do
            status=$(docker inspect taskflow-frontend-deploy \
              --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' \
              2>/dev/null || true)

            echo "Frontend status: $status ($attempt/40)"

            if [ "$status" = "healthy" ]; then
              frontend_ok=true
              break
            fi

            if [ "$status" = "unhealthy" ]; then
              echo "Frontend has become unhealthy."
              break
            fi

            sleep 3
          done

          if [ "$frontend_ok" != "true" ]; then
            echo "Frontend container did not become healthy."
            diagnostics
            exit 1
          fi

          echo "Frontend container is healthy."

          echo "Testing Nginx from inside the frontend container..."

          if ! docker exec taskflow-frontend-deploy \
            wget -q -O /dev/null http://127.0.0.1:8080/; then
            echo "Internal frontend Nginx check failed."
            diagnostics
            exit 1
          fi

          echo "Internal frontend check passed."

          echo "Testing frontend from GitHub Actions runner..."

          if ! curl --http1.1 --connect-timeout 5 --max-time 20 \
            --retry 5 --retry-all-errors --retry-delay 2 \
            --fail --silent --show-error \
            http://127.0.0.1:8080/ -o /dev/null; then
            echo "Frontend host HTTP check failed."
            diagnostics
            exit 1
          fi

          echo "Frontend host HTTP check passed."
          echo "Full deployment verification successful."

      - name: Run API tests against Docker Hub deployment
        working-directory: tests
        env:
          BASE_URL: http://localhost:3000
          NODE_OPTIONS: --experimental-vm-modules
        run: |
          npm install
          npm test

      - name: Record published image references
        run: |
          {
            echo "## Docker Hub publication"
            echo ""
            echo "- Backend: \`${{ secrets.DOCKERHUB_USERNAME }}/taskflow-backend:latest\`"
            echo "- Frontend: \`${{ secrets.DOCKERHUB_USERNAME }}/taskflow-frontend:latest\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup deployment
        if: always()
        run: |
          docker compose -f docker-compose.deploy.yml down -v --remove-orphans || true
