
name: Docker Practical - Publish and Verify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-practical-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish student's images to Docker Hub
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout student's repository
        uses: actions/checkout@v4

      - name: Validate required secrets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || (echo "Missing DOCKERHUB_USERNAME secret" && exit 1)
          test -n "$DOCKERHUB_TOKEN" || (echo "Missing DOCKERHUB_TOKEN secret" && exit 1)
          test -n "$POSTGRES_PASSWORD" || (echo "Missing POSTGRES_PASSWORD secret" && exit 1)

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-backend:${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-frontend:${{ github.sha }}

      - name: Create deployment environment
        env:
          DB_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          python3 - <<'PY'
          import os
          from urllib.parse import quote

          password = os.environ["DB_PASSWORD"]
          database_url = (
              "postgresql://taskflow_user:"
              + quote(password, safe="")
              + "@postgres:5432/taskflow"
          )

          with open(os.environ["GITHUB_ENV"], "a") as env_file:
              env_file.write(f"POSTGRES_PASSWORD={password}\n")
              env_file.write(f"DATABASE_URL={database_url}\n")
          PY

          {
            echo "POSTGRES_DB=taskflow"
            echo "POSTGRES_USER=taskflow_user"
            echo "REDIS_URL=redis://redis:6379"
            echo "JWT_SECRET=$(openssl rand -hex 32)"
            echo "PORT=3000"
            echo "DOCKERHUB_USERNAME=$DOCKERHUB_USERNAME"
          } > .env

      - name: Validate image-based deployment Compose
        run: |
          grep -q 'image:' docker-compose.deploy.yml

          if grep -Eq '^[[:space:]]+build:' docker-compose.deploy.yml; then
            echo "Deployment Compose must use published images, not build:"
            exit 1
          fi

          docker compose -f docker-compose.deploy.yml config --quiet
          echo "Deployment Compose configuration is valid"

      - name: Pull published images
        run: docker compose -f docker-compose.deploy.yml pull

      - name: Deploy using Docker Hub images
        run: docker compose -f docker-compose.deploy.yml up -d

      - name: Verify backend health
        run: |
          healthy=false

          for attempt in $(seq 1 40); do
            if curl --fail --silent http://localhost:3000/health; then
              echo
              echo "Backend is healthy"
              healthy=true
              break
            fi

            echo "Waiting for backend health ($attempt/40)..."
            sleep 3
          done

          if [ "$healthy" != "true" ]; then
            echo "Backend failed health verification"

            echo "=== Container Status ==="
            docker compose -f docker-compose.deploy.yml ps -a

            echo "=== Backend Logs ==="
            docker compose -f docker-compose.deploy.yml logs --no-color backend

            echo "=== PostgreSQL Logs ==="
            docker compose -f docker-compose.deploy.yml logs --no-color postgres

            echo "=== Redis Logs ==="
            docker compose -f docker-compose.deploy.yml logs --no-color redis

            echo "=== Backend Health Details ==="
            container_id=$(docker compose -f docker-compose.deploy.yml ps -q backend)

            if [ -n "$container_id" ]; then
              docker inspect "$container_id" --format '{{json .State.Health}}' || true
            fi

            exit 1
          fi

      - name: Verify frontend accessibility
        run: |
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://localhost:8080/ > /dev/null; then
              echo "Frontend is responding"
              exit 0
            fi

            echo "Waiting for frontend ($attempt/20)..."
            sleep 3
          done

          echo "Frontend verification failed"
          docker compose -f docker-compose.deploy.yml logs --no-color frontend
          exit 1

      - name: Run API tests against Docker Hub deployment
        working-directory: tests
        env:
          BASE_URL: http://localhost:3000
          NODE_OPTIONS: --experimental-vm-modules
        run: |
          npm install
          npm test

      - name: Record published image references
        run: |
          {
            echo "## Docker Hub publication"
            echo ""
            echo "- Backend: \`${{ secrets.DOCKERHUB_USERNAME }}/taskflow-backend:latest\`"
            echo "- Frontend: \`${{ secrets.DOCKERHUB_USERNAME }}/taskflow-frontend:latest\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup deployment
        if: always()
        run: |
          docker compose -f docker-compose.deploy.yml down -v --remove-orphans || true
