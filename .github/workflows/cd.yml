name: Docker Practical - Publish and Verify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-practical-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish student's images to Docker Hub
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout student's repository
        uses: actions/checkout@v4

      - name: Validate required deployment secrets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || (echo "Missing DOCKERHUB_USERNAME secret" && exit 1)
          test -n "$DOCKERHUB_TOKEN" || (echo "Missing DOCKERHUB_TOKEN secret" && exit 1)
          test -n "$POSTGRES_PASSWORD" || (echo "Missing POSTGRES_PASSWORD secret" && exit 1)

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/backend:${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend:${{ github.sha }}

      - name: Create deployment environment file
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          node --input-type=module <<'NODE'
          import { randomBytes } from 'node:crypto';
          import { appendFileSync, writeFileSync } from 'node:fs';

          const { DOCKERHUB_USERNAME, GITHUB_ENV, GITHUB_SHA, POSTGRES_PASSWORD } = process.env;
          const encodedPassword = encodeURIComponent(POSTGRES_PASSWORD);
          const jwtSecret = randomBytes(32).toString('hex');
          const delimiter = `PASSWORD_${randomBytes(16).toString('hex')}`;
          console.log(`::add-mask::${encodedPassword}`);
          console.log(`::add-mask::${jwtSecret}`);
          appendFileSync(GITHUB_ENV, `POSTGRES_PASSWORD<<${delimiter}\n${POSTGRES_PASSWORD}\n${delimiter}\n`);
          writeFileSync('.env', [
            'POSTGRES_DB=taskflow',
            'POSTGRES_USER=taskflow_user',
            `DATABASE_URL=postgresql://taskflow_user:${encodedPassword}@postgres:5432/taskflow`,
            'REDIS_URL=redis://redis:6379',
            `JWT_SECRET=${jwtSecret}`,
            `DOCKERHUB_USERNAME=${DOCKERHUB_USERNAME}`,
            `IMAGE_TAG=${GITHUB_SHA}`,
            '',
          ].join('\n'), { mode: 0o600 });
          NODE

      - name: Validate image-based deployment Compose
        run: |
          grep -q 'image:' docker-compose.deploy.yml
          if grep -Eq '^[[:space:]]+build:' docker-compose.deploy.yml; then
            echo "Deployment Compose must use published images, not build:"
            exit 1
          fi
          docker compose -f docker-compose.deploy.yml config --quiet

      - name: Pull published images
        run: docker compose -f docker-compose.deploy.yml pull

      - name: Deploy using Docker Hub images
        run: |
          if ! docker compose -f docker-compose.deploy.yml up -d --wait --wait-timeout 120; then
            docker compose -f docker-compose.deploy.yml ps
            docker compose -f docker-compose.deploy.yml logs --no-color
            exit 1
          fi

      - name: Verify deployment
        run: |
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 --max-time 8 http://127.0.0.1:3000/health
          echo
          echo "Deployment backend is healthy"
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 --max-time 8 http://127.0.0.1:8080/ > /dev/null
          echo "Deployment frontend is accessible"

      - name: Run API tests against Docker Hub deployment
        working-directory: tests
        env:
          BASE_URL: http://127.0.0.1:3000
          NODE_OPTIONS: --experimental-vm-modules
        run: |
          npm install
          npm test

      - name: Record published image references
        run: |
          {
            echo "## Docker Hub publication"
            echo ""
            echo "- Backend: \`${{ secrets.DOCKERHUB_USERNAME }}/backend:${GITHUB_SHA}\`"
            echo "- Frontend: \`${{ secrets.DOCKERHUB_USERNAME }}/frontend:${GITHUB_SHA}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup deployment
        if: always()
        run: docker compose -f docker-compose.deploy.yml down -v --remove-orphans || true
