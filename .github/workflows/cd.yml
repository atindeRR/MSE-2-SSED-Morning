name: Docker Practical - Publish and Verify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-practical-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish student's images to Docker Hub
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Checkout student's repository
        uses: actions/checkout@v4

      - name: Validate required deployment secrets
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || (echo "Missing DOCKERHUB_USERNAME secret" && exit 1)
          test -n "$DOCKERHUB_TOKEN" || (echo "Missing DOCKERHUB_TOKEN secret" && exit 1)
          test -n "$POSTGRES_PASSWORD" || (echo "Missing POSTGRES_PASSWORD secret" && exit 1)

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/backend:latest
            ${{ env.DOCKERHUB_USERNAME }}/backend:${{ env.IMAGE_TAG }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/frontend:latest
            ${{ env.DOCKERHUB_USERNAME }}/frontend:${{ env.IMAGE_TAG }}

      - name: Configure deployment environment
        run: |
          encoded_password="$(python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["POSTGRES_PASSWORD"], safe=""))')"
          jwt_secret="$(openssl rand -hex 32)"
          echo "::add-mask::$encoded_password"
          echo "::add-mask::$jwt_secret"
          {
            echo "DATABASE_URL=postgresql://taskflow_user:${encoded_password}@postgres:5432/taskflow"
            echo "JWT_SECRET=$jwt_secret"
          } >> "$GITHUB_ENV"

      - name: Validate image-based deployment Compose
        run: |
          grep -q 'image:' docker-compose.deploy.yml
          if grep -Eq '^[[:space:]]+build:' docker-compose.deploy.yml; then
            echo "Deployment Compose must use published images, not build:"
            exit 1
          fi
          docker compose -f docker-compose.deploy.yml config --quiet

      - name: Pull published images
        run: docker compose -f docker-compose.deploy.yml pull

      - name: Deploy using Docker Hub images
        run: docker compose -f docker-compose.deploy.yml up -d

      - name: Verify backend health
        run: |
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://localhost:3000/health; then
              echo
              echo "Deployment backend is healthy"
              exit 0
            fi
            if [ "$attempt" -eq 40 ]; then
              docker compose -f docker-compose.deploy.yml ps
              docker compose -f docker-compose.deploy.yml logs --no-color
              exit 1
            fi
            sleep 3
          done

      - name: Verify frontend and reverse proxy
        run: |
          curl --fail --silent --show-error http://localhost:8080/ > /dev/null
          echo "Frontend is responding"
          curl --fail --silent --show-error http://localhost:8080/health
          echo

      - name: Run API tests against Docker Hub deployment
        env:
          BASE_URL: http://localhost:8080
        run: |
          npm --prefix tests ci
          NODE_OPTIONS=--experimental-vm-modules npm --prefix tests test

      - name: Record published image references
        run: |
          {
            echo "## Docker Hub publication"
            echo ""
            printf -- '- Backend: `%s/backend:%s`\n' "$DOCKERHUB_USERNAME" "$IMAGE_TAG"
            printf -- '- Frontend: `%s/frontend:%s`\n' "$DOCKERHUB_USERNAME" "$IMAGE_TAG"
            printf -- '- Commit: `%s`\n' "$IMAGE_TAG"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup deployment
        if: always()
        run: docker compose -f docker-compose.deploy.yml down -v --remove-orphans || true
