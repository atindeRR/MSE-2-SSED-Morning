
name: Docker Practical - Publish and Verify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-practical-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish student's images to Docker Hub
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 1. Checkout repository
      - name: Checkout student's repository
        uses: actions/checkout@v4

      # 2. Validate GitHub Secrets
      - name: Validate required secrets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || (echo "Missing DOCKERHUB_USERNAME secret" && exit 1)
          test -n "$DOCKERHUB_TOKEN" || (echo "Missing DOCKERHUB_TOKEN secret" && exit 1)
          test -n "$POSTGRES_PASSWORD" || (echo "Missing POSTGRES_PASSWORD secret" && exit 1)
          echo "All required secrets are configured."

      # 3. Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5. Build and push backend image
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-backend:${{ github.sha }}

      # 6. Build and push frontend image
      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-frontend:${{ github.sha }}

      # 7. Create deployment environment file
      - name: Create deployment environment file
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -eu
          umask 077

          JWT_SECRET="$(openssl rand -hex 32)"

          {
            printf '%s\n' "POSTGRES_DB=taskflow"
            printf '%s\n' "POSTGRES_USER=taskflow_user"
            printf 'POSTGRES_PASSWORD=%s\n' "$POSTGRES_PASSWORD"
            printf 'DATABASE_URL=postgresql://taskflow_user:%s@postgres:5432/taskflow\n' "$POSTGRES_PASSWORD"
            printf '%s\n' "REDIS_URL=redis://redis:6379"
            printf 'JWT_SECRET=%s\n' "$JWT_SECRET"
            printf '%s\n' "PORT=3000"
            printf 'DOCKERHUB_USERNAME=%s\n' "$DOCKERHUB_USERNAME"
          } > .env

          echo "Deployment environment file created."

      # 8. Validate deployment Compose file
      - name: Validate image-based deployment Compose
        run: |
          grep -q 'image:' docker-compose.deploy.yml

          if grep -Eq '^[[:space:]]+build:' docker-compose.deploy.yml; then
            echo "Deployment Compose must use published images, not build:"
            exit 1
          fi

          docker compose -f docker-compose.deploy.yml config --quiet
          echo "Deployment Compose validation successful."

      # 9. Pull published images
      - name: Pull published images
        run: docker compose -f docker-compose.deploy.yml pull

      # 10. Deploy using Docker Hub images
      - name: Deploy using Docker Hub images
        run: docker compose -f docker-compose.deploy.yml up -d

      # 11. Verify backend and frontend
      - name: Verify deployment
        run: |
          set -eu

          echo "Checking backend health..."

          for attempt in $(seq 1 40); do
            if curl --fail --silent http://localhost:3000/health; then
              echo
              echo "Backend is healthy."
              break
            fi

            if [ "$attempt" -eq 40 ]; then
              echo "Backend health check failed."
              docker compose -f docker-compose.deploy.yml ps
              docker compose -f docker-compose.deploy.yml logs --no-color
              exit 1
            fi

            sleep 3
          done

          echo "Checking frontend availability..."

          for attempt in $(seq 1 40); do
            if curl --fail --silent http://localhost:8080/ > /dev/null; then
              echo "Frontend is accessible."
              break
            fi

            if [ "$attempt" -eq 40 ]; then
              echo "Frontend health check failed."
              docker compose -f docker-compose.deploy.yml ps
              docker compose -f docker-compose.deploy.yml logs --no-color
              exit 1
            fi

            sleep 3
          done

      # 12. Run API tests
      - name: Run API tests against Docker Hub deployment
        working-directory: tests
        env:
          BASE_URL: http://localhost:3000
          NODE_OPTIONS: --experimental-vm-modules
        run: |
          npm install
          npm test

      # 13. Record published image references
      - name: Record published image references
        run: |
          {
            echo "## Docker Hub publication"
            echo ""
            echo "- Backend: \`${{ secrets.DOCKERHUB_USERNAME }}/taskflow-backend:latest\`"
            echo "- Frontend: \`${{ secrets.DOCKERHUB_USERNAME }}/taskflow-frontend:latest\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # 14. Cleanup deployment
      - name: Cleanup deployment
        if: always()
        run: |
          docker compose -f docker-compose.deploy.yml down -v --remove-orphans || true
